[project]
name = "pyterrier-skills"
version = "0.1.0"
description = "Agent skills for developing with PyTerrier"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "pyterrier[all]>=1.1",
    "sentence-transformers>=3",
    "pyterrier-pisa>=0.4.7",
    "pyterrier-dr>=0.8",
    "pyterrier-splade>=0.1",
    "pyterrier-alpha>=0.16",
    "pyterrier-t5>=0.3",
    "scikit-learn>=1.3",
    "pyterrier-caching>=0.5",
    "pyterrier-rag>=0.3",
    "lightgbm>=4",
    "protobuf",
    "suiteeval>=0.1.8",
    "faiss-cpu",
    "pyterrier-doc2query @ git+https://github.com/terrierteam/pyterrier_doc2query.git",
    # declared so that the CPU-only index below applies (uv sources only cover direct dependencies)
    "torch",
    "torchvision",
    "torchaudio",
]

[tool.uv]
package = false
# pyjnius 1.8.0 declares Python 3.12 support but ships only cp313/cp314 wheels and no sdist.
constraint-dependencies = ["pyjnius<1.8"]

# CPU-only torch. Without this, a fresh lock takes PyPI's CUDA builds (3 GB of NVIDIA libraries) and
# pyterrier-rag's torchvision/torchaudio can end up built for a different torch.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "run: executes a skill's `python run` blocks (needs the full dev group)",
    "slow: also executes `python run slow` blocks (large downloads or a GPU)",
]
addopts = "--strict-markers -m 'not run and not slow'"
