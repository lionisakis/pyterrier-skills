[project]
name = "pyterrier-skills"
version = "0.1.0"
description = "Agent skills for developing with PyTerrier"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "pyterrier[all]>=1.1",
    "sentence-transformers>=3",
    "pyterrier-pisa>=0.4.7",
    "pyterrier-dr>=0.8",
    "pyterrier-splade>=0.1",
    "pyterrier-alpha>=0.16",
    "pyterrier-t5>=0.3",
    "scikit-learn>=1.3",
    "pyterrier-caching>=0.5",
    "pyterrier-rag>=0.3",
    "lightgbm>=4",
    "protobuf",
    "suiteeval>=0.1.8",
    "faiss-cpu",
    "pyterrier-doc2query @ git+https://github.com/terrierteam/pyterrier_doc2query.git",
    # declared so that the CUDA index below applies (uv sources only cover direct dependencies).
    # cu118 builds run on the eval hosts' driver 535 (CUDA 12.2); newer cu12x wheels need a newer driver.
    # 2.7.1 is the oldest torch pyterrier-splade accepts (>=2.6) with a cu118 build.
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
]

[tool.uv]
package = false
# pyjnius 1.8.0 declares Python 3.12 support but ships only cp313/cp314 wheels and no sdist.
constraint-dependencies = ["pyjnius<1.8"]

# CUDA 11.8 torch. PyPI's default torch wheels target a CUDA newer than driver 535 supports, and
# pinning all three keeps pyterrier-rag's torchvision/torchaudio built for the same torch.
[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "run: executes a skill's `python run` blocks (needs the full dev group)",
    "slow: also executes `python run slow` blocks (large downloads or a GPU)",
]
addopts = "--strict-markers -m 'not run and not slow'"
